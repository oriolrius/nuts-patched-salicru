name: nut-salicru

# Deployment on nas1 (QNAP Container Station). The patched NUT owns the UPS
# USB device and serves upsd on :3493. PeaNUT and the QNAP (in network-client
# mode) connect to it.
#
# Prereq: QTS native UPS driver must NOT hold the USB device (set QTS UPS to
# "network client" mode first — see README "Production cutover").

services:
  nut:
    image: ghcr.io/oriolrius/nuts-patched-salicru:latest
    container_name: nut-salicru
    restart: unless-stopped
    # USB HID access: pass the whole USB bus through. usbhid-ups uses libusb
    # and re-binds by vendor/product id, so the device path may float.
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - "3493:3493"
    environment:
      UPS_NAME: salicru
      UPS_DESC: "Salicru SLC-1500-TWIN PRO2"
      VENDORID: "06da"
      PRODUCTID: "ffff"
      LISTEN_ADDR: "0.0.0.0"
      LISTEN_PORT: "3493"
      # Optional: enable battery-test / beeper commands.
      # ADMIN_USER: admin
      # ADMIN_PASSWORD: change-me
